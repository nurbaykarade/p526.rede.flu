name: redewendix
description: "Redewendix – jeden Tag eine deutsche Redewendung auf dem Sperrbildschirm."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.3
  share_plus: ^13.3.0
  home_widget: ^0.10.0
  in_app_purchase: ^3.3.1
  google_mobile_ads: ">=9.0.0 <9.1.0" # 9.1.0 baut unter iOS nicht (privater SDK-Header)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/idioms.json
    - assets/packs/
